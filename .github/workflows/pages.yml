name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build catalogue from checked-in sources
        run: python site/scripts/build_data.py
      - name: Verify standard and source audits
        run: python -m unittest discover -s site/scripts -p 'test_*.py'
      - name: Package static site
        run: python site/scripts/build_standalone.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
